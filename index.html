<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Star Holo-Comm | 中秋全息通訊</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #00ffaa;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }
        .hud-header {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            pointer-events: none;
            border-left: 3px solid #00ffaa;
            padding: 10px 16px;
            background: rgba(3, 10, 15, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 0 8px 8px 0;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.15);
        }
        .hud-title {
            font-size: 16px; font-weight: 800; letter-spacing: 2px;
            color: #ffffff; text-transform: uppercase; text-shadow: 0 0 8px #00ffaa;
        }
        .hud-subtitle {
            font-size: 11px; color: #00ffaa; opacity: 0.8; letter-spacing: 1px; margin-top: 2px;
        }
        .top-right-controls {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            display: flex; gap: 10px;
        }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(5, 20, 25, 0.75); border: 1px solid rgba(0, 255, 170, 0.4);
            color: #00ffaa; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px);
        }
        .ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 500px;
            background: rgba(5, 15, 22, 0.88); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 170, 0.3); border-radius: 16px;
            padding: 18px; z-index: 10;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        .ui-panel.collapsed {
            transform: translate(-50%, calc(100% + 30px)); opacity: 0; pointer-events: none;
        }
        .panel-toggle-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9; padding: 10px 20px; background: rgba(5, 20, 25, 0.85);
            border: 1px solid #00ffaa; border-radius: 20px; color: #00ffaa;
            font-size: 13px; font-weight: bold; cursor: pointer; backdrop-filter: blur(8px);
        }
        textarea.msg-input {
            width: 100%; height: 70px; background: rgba(0, 10, 18, 0.7);
            border: 1px solid rgba(0, 255, 170, 0.3); border-radius: 8px;
            color: #ffffff; padding: 10px; font-size: 14px; resize: none; outline: none;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn {
            padding: 12px; border-radius: 8px; border: 1px solid #00ffaa;
            background: rgba(0, 255, 170, 0.12); color: #00ffaa; font-size: 13px;
            font-weight: bold; cursor: pointer;
        }
        .btn-primary { background: #00ffaa; color: #030508; border: none; }
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 2; opacity: 0.6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="scanlines"></div>
    <div id="webgl-container"></div>

    <div class="hud-header">
        <div class="hud-title">DEATH STAR HOLO-COMM</div>
        <div class="hud-subtitle">IMPERIAL MID-AUTUMN TRANSMISSION</div>
    </div>

    <div class="top-right-controls">
        <button class="icon-btn" id="share-btn" title="複製連結">🔗</button>
    </div>

    <button class="panel-toggle-btn" id="panel-toggle-btn">⚙️ 控制面板</button>

    <div class="ui-panel collapsed" id="ui-panel">
        <label style="font-size:12px; color:#88ccee; margin-bottom:6px; display:block;">全息祝賀詞（自動斷行排版）</label>
        <textarea class="msg-input" id="msg-input">祝大家中秋節快樂！
月圓人團圓，事事順心！
MAY THE FORCE BE WITH YOU</textarea>
        <div class="btn-grid">
            <button class="btn btn-primary" id="play-btn">▶️ 展演動畫</button>
            <button class="btn" id="record-btn">🎥 錄影下載</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030508, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 1. Canvas 貼圖繪製 (基底金屬與月球表面) ---
        function createPlanetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#181b20';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 橫向金屬線
            ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 3;
            for (let y = 0; y < canvas.height; y += 16) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 縱向金屬線
            ctx.strokeStyle = '#111418'; ctx.lineWidth = 2;
            for (let x = 0; x < canvas.width; x += 32) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            // 赤道溝槽
            ctx.fillStyle = '#060709';
            ctx.fillRect(0, canvas.height / 2 - 14, canvas.width, 28);
            ctx.strokeStyle = '#222730'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, canvas.height / 2 - 14); ctx.lineTo(canvas.width, canvas.height / 2 - 14); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, canvas.height / 2 + 14); ctx.lineTo(canvas.width, canvas.height / 2 + 14); ctx.stroke();

            // 月球表面質感 (X: 0~512 與 1536~2048)
            function drawMoonSection(startX, width) {
                const imgData = ctx.getImageData(startX, 0, width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let n = (Math.random() * 50 - 25) + Math.sin(i * 0.005) * 20;
                    let val = 150 + n;
                    data[i] = val; data[i+1] = val + 2; data[i+2] = val + 8;
                }
                ctx.putImageData(imgData, startX, 0);
            }
            drawMoonSection(0, 512);
            drawMoonSection(1536, 512);

            // 月球坑洞
            ctx.fillStyle = 'rgba(100, 105, 115, 0.45)';
            for(let i=0; i<40; i++) {
                let cx = (Math.random() > 0.5 ? 0 : 1536) + Math.random() * 512;
                let cy = Math.random() * canvas.height;
                let cr = 10 + Math.random() * 40;
                ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const planetMat = new THREE.MeshStandardMaterial({
            map: createPlanetTexture(),
            roughness: 0.45,
            metalness: 0.5
        });

        const sphereRadius = 2.2;
        const sphereGeo = new THREE.SphereGeometry(sphereRadius, 64, 64);
        const planetMesh = new THREE.Mesh(sphereGeo, planetMat);
        scene.add(planetMesh);

        // 燈光
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x223344, 0.6));

        // --- 2. 3D 立體凹盤 ---
        const dishDepth = 0.22;
        const dishRadius = 0.65;
        const dishGeo = new THREE.ConeGeometry(dishRadius, dishDepth, 32, 8, true);
        dishGeo.rotateX(Math.PI);

        function createDishCanvasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const cx = 256, cy = 256;

            ctx.fillStyle = '#1b1f26'; ctx.fillRect(0, 0, 512, 512);

            for (let r = 240; r > 20; r -= 24) {
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = (r % 48 === 0) ? '#12151b' : '#252b36'; ctx.fill();
                ctx.strokeStyle = '#0a0c0e'; ctx.lineWidth = 3; ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)'; ctx.lineWidth = 2;
            for (let i = 0; i < 32; i++) {
                let angle = (i / 32) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * 20, cy + Math.sin(angle) * 20);
                ctx.lineTo(cx + Math.cos(angle) * 240, cy + Math.sin(angle) * 240);
                ctx.stroke();
            }

            ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2);
            ctx.fillStyle = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15; ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const dishMat = new THREE.MeshStandardMaterial({
            map: createDishCanvasTexture(),
            roughness: 0.35,
            metalness: 0.6,
            side: THREE.DoubleSide
        });

        const dishMesh = new THREE.Mesh(dishGeo, dishMat);

        // --- 3. 北半球發射孔法線對齊 ---
        const ANCHOR_Y = 1.1;
        const ANCHOR_X = Math.sqrt(sphereRadius * sphereRadius - ANCHOR_Y * ANCHOR_Y);

        const superlaserAnchorGroup = new THREE.Group();
        const anchorPos = new THREE.Vector3(ANCHOR_X, ANCHOR_Y, 0);
        superlaserAnchorGroup.position.copy(anchorPos);

        const normalVec = anchorPos.clone().normalize();
        const targetPos = anchorPos.clone().add(normalVec);
        superlaserAnchorGroup.lookAt(targetPos);

        planetMesh.add(superlaserAnchorGroup);

        dishMesh.position.set(0, 0, -dishDepth / 2);
        dishMesh.rotation.set(Math.PI / 2, 0, 0);
        superlaserAnchorGroup.add(dishMesh);

        // --- 4. 全息光錐與全息文字 Plane ---
        const coneHeight = 3.2;
        const coneGeo = new THREE.ConeGeometry(1.8, coneHeight, 32, 1, true);
        coneGeo.translate(0, -coneHeight / 2, 0);
        coneGeo.rotateX(-Math.PI / 2);

        const holoCone = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({
            color: 0x00ff88, transparent: true, opacity: 0.25, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
        }));
        superlaserAnchorGroup.add(holoCone);

        const textCanvas = document.createElement('canvas');
        textCanvas.width = 1024; textCanvas.height = 1024;
        const textCtx = textCanvas.getContext('2d');
        const textTexture = new THREE.CanvasTexture(textCanvas);

        const textPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(3.2, 3.2),
            new THREE.MeshBasicMaterial({
                map: textTexture, transparent: true, opacity: 0.95, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
            })
        );
        textPlane.position.set(0, 0, coneHeight);
        superlaserAnchorGroup.add(textPlane);

        function renderHologramText(rawText) {
            textCtx.clearRect(0, 0, 1024, 1024);

            textCtx.strokeStyle = 'rgba(0, 255, 136, 0.4)'; textCtx.lineWidth = 4;
            textCtx.beginPath(); textCtx.arc(512, 512, 480, 0, Math.PI * 2); textCtx.stroke();
            textCtx.beginPath(); textCtx.arc(512, 512, 360, 0, Math.PI * 2); textCtx.stroke();

            let lines = [];
            if (rawText.includes(' ')) {
                const words = rawText.split(' ');
                let cur = '';
                words.forEach(w => {
                    if ((cur + ' ' + w).length > 12) { lines.push(cur.trim()); cur = w; }
                    else { cur += (cur ? ' ' : '') + w; }
                });
                if (cur) lines.push(cur.trim());
            } else {
                if (rawText.length > 6) {
                    const mid = Math.ceil(rawText.length / 2);
                    lines.push(rawText.substring(0, mid));
                    lines.push(rawText.substring(mid));
                } else { lines.push(rawText); }
            }

            let fontSize = lines.length >= 3 ? 65 : (lines.length === 2 ? 80 : 95);
            textCtx.font = `900 ${fontSize}px sans-serif`;
            textCtx.textAlign = 'center'; textCtx.textBaseline = 'middle';

            const lh = fontSize * 1.35;
            const startY = 512 - ((lines.length - 1) * lh) / 2;

            lines.forEach((l, idx) => {
                const y = startY + (idx * lh);
                textCtx.strokeStyle = '#004422'; textCtx.lineWidth = 14; textCtx.strokeText(l, 512, y);
                textCtx.strokeStyle = '#00ff88'; textCtx.lineWidth = 5; textCtx.strokeText(l, 512, y);
                textCtx.fillStyle = '#ffffff'; textCtx.fillText(l, 512, y);
            });

            textTexture.needsUpdate = true;
        }

        // --- 5. 輪播控制與【錄影自動化連動】 ---
        let messageList = ["祝大家中秋節快樂！", "月圓人團圓，事事順心！", "MAY THE FORCE BE WITH YOU"];
        let msgIndex = 0;
        let carouselTimer = null;
        let isRecordingSequence = false;
        let recordedMessagesCount = 0;

        function updateCarousel() {
            renderHologramText(messageList[msgIndex]);
            msgIndex = (msgIndex + 1) % messageList.length;

            if (isRecordingSequence) {
                recordedMessagesCount++;
                // 當所有訊息皆播放完全一次後，自動完成錄影下載
                if (recordedMessagesCount >= messageList.length) {
                    setTimeout(() => stopAndDownloadRecording(), 3800);
                }
            }
        }

        function startCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);
            updateCarousel();
            carouselTimer = setInterval(updateCarousel, 3800);
        }

        const uiPanel = document.getElementById('ui-panel');
        document.getElementById('panel-toggle-btn').onclick = () => uiPanel.classList.toggle('collapsed');

        const START_ANGLE_Y = Math.PI * 0.5;
        const TARGET_ANGLE_Y = Math.PI * 1.5;
        const TARGET_ANGLE_X = 0.52; 

        function resetSpherePose() {
            planetMesh.rotation.set(0, START_ANGLE_Y, 0);
        }

        resetSpherePose();
        startCarousel();

        document.getElementById('play-btn').onclick = () => {
            const val = document.getElementById('msg-input').value.trim();
            if (val) {
                messageList = val.split('\n').filter(s => s.trim());
            }
            msgIndex = 0;
            uiPanel.classList.add('collapsed');
            resetSpherePose();
            startCarousel();
        };

        // --- 6. MediaRecorder 自動錄影控制核心 ---
        let mediaRecorder = null;
        let recordedChunks = [];
        const recordBtn = document.getElementById('record-btn');

        recordBtn.onclick = () => {
            if (isRecordingSequence) return;

            const val = document.getElementById('msg-input').value.trim();
            if (val) {
                messageList = val.split('\n').filter(s => s.trim());
            }

            // 1. 初始化錄影狀態與文字輪播計數
            isRecordingSequence = true;
            recordedMessagesCount = 0;
            msgIndex = 0;
            recordBtn.innerText = "🔴 錄影中...";
            recordBtn.style.background = "rgba(255, 50, 50, 0.2)";
            recordBtn.style.color = "#ff4444";
            uiPanel.classList.add('collapsed');

            // 2. 復位球體並啟動錄影器
            resetSpherePose();

            const stream = renderer.domElement.captureStream(60);
            recordedChunks = [];
            
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm';
            }

            mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 8000000 });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `DeathStar_HoloComm_Transmission.webm`;
                a.click();
                URL.revokeObjectURL(url);

                // 重置錄影按鈕 UI
                isRecordingSequence = false;
                recordBtn.innerText = "🎥 錄影下載";
                recordBtn.style.background = "rgba(0, 255, 170, 0.12)";
                recordBtn.style.color = "#00ffaa";
            };

            mediaRecorder.start();
            startCarousel();
        };

        function stopAndDownloadRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }

        // 7. 動畫主循環
        let animTime = 0;
        function animate() {
            requestAnimationFrame(animate);

            // 階段 1: 水平旋轉
            if (planetMesh.rotation.y < TARGET_ANGLE_Y) {
                planetMesh.rotation.y += 0.006;
                if (planetMesh.rotation.y > TARGET_ANGLE_Y) planetMesh.rotation.y = TARGET_ANGLE_Y;
            } 
            // 階段 2: 旋轉完成後向下傾斜點頭
            else if (planetMesh.rotation.x < TARGET_ANGLE_X) {
                planetMesh.rotation.x += 0.005;
                if (planetMesh.rotation.x > TARGET_ANGLE_X) planetMesh.rotation.x = TARGET_ANGLE_X;
            }

            animTime += 0.05;
            holoCone.material.opacity = 0.22 + Math.sin(animTime * 3) * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        animate();
    </script>
</body>
</html>
